# CI · build y tests en cada push a main y en cada pull request.
# Seguridad: permisos mínimos (solo lectura), timeout de 10 min y versiones fijas
# (acciones fijadas por SHA de commit, runner y SDK de .NET con versión exacta).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# El repo tiene demos/ y taller/ en la raíz: la app vive en taller/pedidos-web.
defaults:
  run:
    working-directory: taller/pedidos-web

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.403'

      - name: Restore
        run: dotnet restore PedidosWeb.sln

      - name: Build
        run: dotnet build PedidosWeb.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test PedidosWeb.sln --no-build --configuration Release --verbosity normal
